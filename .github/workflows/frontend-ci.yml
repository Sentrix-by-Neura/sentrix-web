name: Frontend CI

# When should this run?
# - on every push to main
# - on every pull request (opened, or updated with new commits)
on:
  push:
    branches: [main]
  pull_request:

# If you push twice quickly, cancel the older run for the same branch/PR.
concurrency:
  group: frontend-ci-${{ github.ref }}
  cancel-in-progress: true

# Least privilege: this workflow only needs to read the code.
permissions:
  contents: read

jobs:
  lint-and-build:
    name: Lint and build
    runs-on: ubuntu-latest
    timeout-minutes: 15

    # Every "run:" step below executes inside the frontend/ folder.
    defaults:
      run:
        working-directory: frontend

    steps:
      - name: Check out the code
        uses: actions/checkout@v4

      - name: Set up pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
          cache-dependency-path: frontend/pnpm-lock.yaml

      # Use the checked-in pnpm lockfile so CI matches local dependencies.
      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Lint
        run: pnpm run lint

      - name: Test production flows
        run: pnpm test

      # No real secrets here on purpose. Without NEXT_PUBLIC_SUPABASE_* the app
      # sets its Supabase client to null, so the build never touches a real
      # database. These placeholders only make that explicit.
      - name: Build
        run: pnpm run build
        env:
          NEXT_PUBLIC_SUPABASE_URL: ""
          NEXT_PUBLIC_SUPABASE_ANON_KEY: ""
          NEXT_PUBLIC_API_URL: http://localhost:8080
          NEXT_TELEMETRY_DISABLED: "1"
