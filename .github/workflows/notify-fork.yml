name: Trigger Fork Sync

on:
  push:
    branches: [ main ]

jobs:
  trigger-fork:
    runs-on: ubuntu-latest
    steps:
      - name: Dispatch event to fork
        run: |
          curl -L \
            -X POST \
            -H "Accept: application/vnd.github+json" \
            -H "Authorization: Bearer ${{ secrets.FORK_SYNC_TOKEN }}" \
            -H "X-GitHub-Api-Version: 2022-11-28" \
            https://api.github.com/repos/Maiizo/sentrix/dispatches \
            -d '{"event_type":"upstream-pushed"}'
