name: Trigger Fork Sync

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  trigger-fork:
    runs-on: ubuntu-latest
    steps:
      - name: Call GitHub Native Fork Sync API
        env:
          FORK_SYNC_TOKEN: ${{ secrets.FORK_SYNC_TOKEN }}
        run: |
          curl -L \
            -X POST \
            -H "Accept: application/vnd.github+json" \
            -H "Authorization: Bearer $FORK_SYNC_TOKEN" \
            -H "X-GitHub-Api-Version: 2022-11-28" \
            https://api.github.com/repos/Maiizo/sentrix/merge-upstream \
            -d '{"branch":"main"}'
